[package]
name = "curio"
version = "0.3.2"
edition = "2021"
authors = ["Matheus C. Pestana <MACAPE Pesquisas e Consultoria em Tecnologia Ltda>"]
description = "Curió — TUI para monitorar mudanças em URLs"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/mateuspestana/curio"

[[bin]]
name = "curio"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false }
html2text = "0.13"
notify-rust = "4"
open = "5"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.22"
sha2 = "0.10"
similar = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
