[package]
name = "curio"
version = "0.3.0"
edition = "2021"
authors = ["Matheus C. Pestana <MACAPE Pesquisas e Consultoria em Tecnologia Ltda>"]
description = "Curió — TUI para monitorar mudanças em URLs"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/mateuspestana/curio"

[[bin]]
name = "curio"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
crossterm = "0.28"
html2text = "0.13"
notify-rust = "4"
open = "5"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.22"
sha2 = "0.10"
similar = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
